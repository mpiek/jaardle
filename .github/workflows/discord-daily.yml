# Discord-bericht met de vraag van de dag — ALLEEN HANDMATIG te starten (Actions → Discord daily → Run workflow).
#
# De dagelijkse post draait NIET meer hier: GitHub liet geplande runs op 9–10/10/2026 4–7 uur te laat komen of weg, dus
# het plannen gebeurt in de database (pg_cron + pg_net, post_daily_discord()). Daarom heeft deze workflow bewust geen
# `schedule:` (een test bewaakt dat): twee planners naast elkaar zouden dubbel posten.
#
#   check = alleen controleren (preview + bestaat de webhook; post niets)
#   post  = nu echt posten. LET OP: de database weet daar niets van; zet daarna een rij in public.discord_daily_posts
#           (confirmed = true) voor die datum, anders post pg_cron dezelfde dag nog eens.
#
# Tekst en regels: tools/discord-daily.mjs. De webhook staat als repo-secret DISCORD_DAILY_WEBHOOK.
name: Discord daily

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check = alleen controleren (post niets) · post = nu echt posten (zie de opmerking bovenin)"
        type: choice
        options: [check, post]
        default: check

permissions:
  contents: read

concurrency:
  group: discord-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_DAILY_WEBHOOK: ${{ secrets.DISCORD_DAILY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleren zonder te posten
        if: inputs.action == 'check'
        run: node tools/discord-daily.mjs --check-webhook
      - name: Posten
        if: inputs.action == 'post'
        run: node tools/discord-daily.mjs --send

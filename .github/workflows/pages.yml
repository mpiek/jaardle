# Deploy naar GitHub Pages via Actions (vervangt de legacy Jekyll-pijplijn,
# die op 2026-07-02 vier deploys op rij in "deployment_queued" liet smoren).
# De site is puur statisch; Jekyll deed alleen excludes — die bootst de
# rsync-staging hieronder 1-op-1 na (zie het oude _config.yml).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site stagen (zelfde excludes als het oude _config.yml)
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude='.git*' \
            --exclude='_config.yml' \
            --exclude='*.log' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='*.template.html' \
            ./ /tmp/site/
      # v5/v5 sinds 24/11/2026: met v3/v4 faalde de deploy vier keer op rij ("Deployment failed, try again later" en
      # "No artifacts named github-pages"). v5 uploadt via upload-artifact v7, deploy-pages v5.0.1 pollt met backoff.
      # Vanaf v4 gaan dotfiles niet meer mee; de site heeft er geen.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site
      # NB: langer laten wachten kan niet — deploy-pages topt z'n
      # timeout-input intern af op 10 min (MAX_TIMEOUT in de action).
      - id: deployment
        uses: actions/deploy-pages@v5

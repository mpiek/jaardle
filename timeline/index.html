<script>
  (function () {
    try {
      var th = localStorage.getItem("jaardle:theme");
      var C = { light: "#f4f1ea", parchment: "#e5d8bd", midnight: "#1e1030", gold: "#14110a" };
      if (th && th !== "dark") {
        document.documentElement.dataset.theme = th;
        if (C[th]) document.querySelector('meta[name="theme-color"]').content = C[th];
      }
    } catch (e) { /* private mode zonder localStorage → donker */ }
  })();
</script>
